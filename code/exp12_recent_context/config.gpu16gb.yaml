# Start with CPU feature storage: full one-hot features are larger than EXP9.
extends: config.yaml
runtime:
  feature_device: cpu
  cpu_threads: 8
  progress_update_batches: 100
training:
  negatives_per_positive: 30
  batch_size: 2048
  positive_class_weight_power: 0.0
sampling:
  edge_chunk_size: 500000
evaluation:
  batch_size: 8192
