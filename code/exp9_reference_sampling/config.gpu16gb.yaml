# RTX 5060 Ti 16 GiB / 32 GiB RAM: keep proposal's batch, precision and model.
extends: config.yaml

experiment:
  on_existing: auto
  overwrite: false

runtime:
  feature_device: cuda
  cpu_threads: 8
  training_backend: factorized
  cache_sampler_on_device: true
  progress_update_batches: 100

sampling:
  edge_chunk_size: 500000

evaluation:
  batch_size: 8192

training:
  batch_size: 4096
  fused_adam: true
