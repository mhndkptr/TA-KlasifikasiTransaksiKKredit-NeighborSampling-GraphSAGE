data:
  transactions: ../../dataset/User0_credit_card_transactions.csv
  max_rows: 20000
paths:
  cache: ../../model/exp15/smoke_cache
  results: ../../result/exp15_smoke
reference:
  checkout: ../../../Ref/Inductive-Graph-Representation-Learning-for-Fraud-Detection
  files: [Experimental Pipeline.ipynb, inductiveGRL/hinsage.py, Demo/FIGRL.m]
  proven_parameters: {window_days: 17, step_days: 5, holdout_days: 5, embedding_size: 64}
protocol:
  folds: 1
  window_days: 17
  holdout_days: 5
  step_days: 5
  minimum_fraud: 1
  minimum_normal: 1
experiment:
  variants: [features_only, hinsage_plus_features, figrl_plus_features]
  seeds: [42]
sampling: {undersampling_rate: null}
hinsage:
  embedding_size: 8
  num_samples: [2, 4]
  batch_size: 32
  epochs: 1
  learning_rate: 0.001
  train_fraction: 0.8
figrl: {embedding_size: 8, intermediate_dim: 24}
classifier: {n_estimators: 10}
evaluation: {threshold: 0.5}
backends: {hinsage: pytorch_compat, figrl: scipy_compat, classifier: sklearn_compat}
runtime: {device: cpu, chunk_rows: 5000, progress_bar: true}

