data:
  transactions: ../../dataset/credit_card_transactions-ibm_v2.csv
paths:
  cache: ../../model/exp14/cache
  results: ../../result/exp14
runtime:
  device: auto
  cpu_threads: 4
  duckdb_memory_limit: 4GB
  chunk_rows: 100000
protocol:
  # Audit full-data: only one non-overlapping 90-day origin has labeled
  # selection, calibration, and assessment before the 2017 fraud gap.
  origins: 1
  window_days: 90
  assessment_end_date: '2017-01-01'
  label_delay_days: 0
  minimum_fraud: 25
  minimum_chip_fraud: 25
experiment:
  # Primary thesis comparison: only the neighbor strategy changes.
  variants: [R0]
  strategies: [uniform, topology, importance]
  seeds: [42]
sampling:
  topology_alpha: 0.5
  topology_smoothing: 20.0
  topology_balance: true
  importance_gamma: 0.3
  importance_degree_mode: projected_transaction
  ppr_beta: 0.15
training:
  negatives_per_positive: 30
  epochs: 100
  min_epochs: 20
  patience: 20
  batch_size: 512
  eval_batch_size: 2048
  learning_rate: 0.001
  fanout: 25
evaluation:
  primary_threshold: fpr_0_001
