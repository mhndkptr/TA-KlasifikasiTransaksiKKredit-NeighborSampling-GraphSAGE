data:
  transactions: "../../dataset/credit_card_transactions-ibm_v2.csv"
  max_rows: null
  start_year: 2016

# ==============================================================================
# PILAR I: MULTI-HORIZON ROLLING WINDOW (WALK-FORWARD VALIDATION - SPLIT-2)
# ==============================================================================
time_windows:
  windows:
    - id: "window_1"
      name: "Window 1 (2017–2018)"
      reference_date: "2017-01-01"
      train_days: 300
      val_days: 30
      gap_days: 8
      test_days: 60
    - id: "window_2"
      name: "Window 2 (2018–2019)"
      reference_date: "2018-01-01"
      train_days: 300
      val_days: 30
      gap_days: 8
      test_days: 60
    - id: "window_3"
      name: "Window 3 (2019–2020)"
      reference_date: "2019-01-01"
      train_days: 300
      val_days: 30
      gap_days: 8
      test_days: 60

  # SPLIT-3: Ablasi Durasi Embargo Gap pada Horizon Inti (Window 2)
  embargo_ablation:
    enabled: true
    target_window_id: "window_2"
    gap_durations: [0, 8, 30] # 0d (tanpa gap), 8d (standar SHINE), 30d (billing cycle)

features:
  mode: "clean" # Amount, Use Chip, MCC, Errors?, Merchant State, cyclical time (tanpa Zip & Merchant City)
  use_cyclical_time: true
  exclude_high_cardinality: true # Eksplisit memblokir Zip dan Merchant City

sampling:
  method: "uniform" # Pilihan: uniform, topology, importance
  undersampling_ratio: 1.0 # 1.0 = topologi asli dipertahankan

model:
  hidden_channels: 128 # 128-dimensi representasi struktural GraphSAGE
  out_channels: 1
  num_layers: 2
  aggr: "mean"
  dropout: 0.2

training:
  batch_size: 1024
  epochs: 20 # Early stopping berbasis Val AUPRC
  learning_rate: 0.001
  weight_decay: 0.0001
  label_smoothing: 0.0
  grad_clip_norm: 5.0
  warmup_epochs: 0
  use_lr_scheduler: true
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 3
  early_stopping_patience: 7
  loss_weight_strategy: "sqrt" # Sqrt pos_weight teredam (~27x)
  max_pos_weight: 50.0
  log_step_interval: 1
  num_neighbors: [15, 10]

# ==============================================================================
# PILAR III: REGULARISASI POHON XGBOOST (HASIL OPTIMAL EXP21B)
# ==============================================================================
classifier:
  type: "xgboost"
  n_estimators: 100
  max_depth: 4
  learning_rate: 0.05
  min_child_weight: 10
  subsample: 0.8
  colsample_bytree: 0.8
  scale_pos_weight_strategy: "sqrt" # sqrt(neg/pos) mencegah lonjakan false alarms

threshold_calibration:
  selection_metric: "val_f1"
  min_precision_constraint: 0.10

# Ablasi nilai tambah representasi GraphSAGE pada setiap window (Tabular vs GNN vs Hybrid)
ablation:
  feature_subsets: true

output:
  model_dir: "../../model/exp21c"
  result_dir: "../../result/exp21c"
