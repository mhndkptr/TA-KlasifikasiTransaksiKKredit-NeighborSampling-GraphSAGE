data:
  # Path dataset yang sudah ada di Kaggle (credit-card-transactions)
  transactions: "/kaggle/input/credit-card-transactions/credit_card_transactions-ibm_v2.csv"
  max_rows: null
  train_fraction: 0.7
  val_fraction: 0.15

sampling:
  method: "uniform" # Pilihan: uniform, topology, importance
  undersampling_ratio: 0.3 # Moderate ratio untuk menjaga struktur graf

model:
  hidden_channels: 256
  out_channels: 1
  num_layers: 3
  aggr: "max"

training:
  batch_size: 1024
  epochs: 10
  learning_rate: 0.001
  num_neighbors: [15, 10]

output:
  # Path output pada Kaggle Notebook (Folder /kaggle/working/ adalah direktori yang akan disimpan setelah run selesai)
  model_dir: "/kaggle/working/model/exp19"
  result_dir: "/kaggle/working/result/exp19"
