data:
  # Path dataset di Google Drive (Silakan sesuaikan dengan lokasi dataset di GDrive Anda)
  transactions: "/content/drive/MyDrive/Dataset/credit_card_transactions-ibm_v2.csv"
  max_rows: null
  train_fraction: 0.7
  val_fraction: 0.15

sampling:
  method: "uniform" # Pilihan: uniform, topology, importance
  undersampling_ratio: 1.0 # 1.0 artinya tidak ada undersampling (menghindari kerusakan topologi)

model:
  hidden_channels: 128
  out_channels: 1
  num_layers: 2
  aggr: "mean"

training:
  batch_size: 1024
  epochs: 10
  learning_rate: 0.001
  num_neighbors: [15, 10]

output:
  # Path output pada Google Drive untuk menyimpan model dan hasil evaluasi secara permanen
  model_dir: "/content/drive/MyDrive/TA_Output/model/exp20"
  result_dir: "/content/drive/MyDrive/TA_Output/result/exp20"
