experiment:
  id: "EXP21E"
  version: "v3"
  window_id: "primary_2018"
  seed: 42
  evaluation_seed: 1042
  audit_seed: 2042
  status: "sampler_validation_gate"

data:
  transactions: "../../dataset/credit_card_transactions-ibm_v2.csv"
  max_rows: null
  start_year: 2016

time_window:
  reference_date: "2018-01-01"
  train_days: 300
  val_days: 30
  gap_days: 8
  test_days: 60

features:
  mode: "clean" # "clean" (tanpa Zip & Merchant City demi anti-leakage)
  use_cyclical_time: true
  use_amount_log: true
  exclude_high_cardinality: true

sampling:
  method: "uniform" # Pilihan: "uniform", "topology", "importance"
  undersampling_ratio: 1.0
  weight_attr: "sampling_weight"
  smoothing_alpha: 0.1

model:
  hidden_channels: 128
  out_channels: 1
  num_layers: 2
  aggr: "mean"
  dropout: 0.2

training:
  batch_size: 1024
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  label_smoothing: 0.0
  grad_clip_norm: 5.0
  warmup_epochs: 0
  use_lr_scheduler: true
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 3
  early_stopping_patience: 7
  loss_weight_strategy: "sqrt" # sqrt(neg/pos) ~ 27.06 untuk kestabilan gradien
  max_pos_weight: 50.0
  log_step_interval: 1
  num_neighbors: [15, 10]

classifier:
  type: "end_to_end_gnn" # Klasifikasi langsung melalui linear classifier head bawaan GraphSAGE (Sesuai Proposal)

threshold_calibration:
  selection_metric: "val_f1"
  min_precision_constraint: 0.15

reproducibility:
  deterministic: true
  warn_only: true
  compute_dataset_sha256: false

validation:
  empirical_draws: 10000
  max_probability_error: 0.03

smoke:
  max_rows_per_split: 20000
  epochs: 2

output:
  result_dir: "../../result/exp21e"
  snapshot_source: true
