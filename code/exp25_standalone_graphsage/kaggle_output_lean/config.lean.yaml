experiment:
  id: "EXP25-StandaloneGraphSAGE-Lean90d"
  run_id: null # Optional custom Run ID (null = auto: exp25_{sampling}_s{seed}_k{k1}x{k2}_tr90d_{timestamp})
  version: "v1_lean_90d_data_constrained"
  seed: 42
  evaluation_seed: 1042
  seeds: [42, 100, 2026, 3407, 8713]

data:
  transactions: "../../dataset/credit_card_transactions-ibm_v2.csv"
  max_rows: null
  start_year: 2018 # Mempercepat loading (abaikan 2002-2017) karena window dimulai Juli 2018

# Skenario C: Lean / Data-Constrained Graph
# Mengambil 90 hari data latih terbaru menjelang validasi (30 Juli - 28 Oktober 2018)
# Membuang 210 hari awal (1 Januari - 29 Juli 2018)
# Test set tetap identik 100% dengan baseline EXP25 (283,529 transaksi, 421 fraud)
time_window:
  reference_date: "2018-07-30"
  train_days: 90
  val_days: 30
  gap_days: 8
  test_days: 60

features:
  mode: "clean"
  use_cyclical_time: true
  use_amount_log: true
  exclude_high_cardinality: true

sampling:
  method: "uniform"
  undersampling_ratio: 1.0
  weight_attr: "sampling_weight"
  power_exponent: 1.0
  smoothing_alpha: 0.1
  topology_alpha: 0.5
  importance_gamma: 0.3
  ppr_teleport: 0.15
  ppr_steps: 3

model:
  hidden_channels: 128
  out_channels: 1
  num_layers: 2
  aggr: "mean"
  dropout: 0.2

training:
  batch_size: 1024
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  label_smoothing: 0.0
  grad_clip_norm: 5.0
  warmup_epochs: 0
  use_lr_scheduler: true
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 3
  early_stopping_patience: 7
  loss_weight_strategy: "sqrt"
  max_pos_weight: 50.0
  log_step_interval: 1
  num_neighbors: [5, 5]

threshold_calibration:
  selection_metric: "val_f1"
  min_precision_constraint: 0.15

operational:
  budgets: [100, 200, 300, 421, 500, 1000]

reproducibility:
  deterministic: true
  warn_only: true

execution:
  seeds_to_run: [42, 100, 2026, 3407, 8713]
  resume_completed: true

logging:
  log_to_file: true
  log_dir: "../../result/exp25_standalone_graphsage/logs"
  log_level: "INFO"

output:
  model_dir: "../../model/exp25_standalone_graphsage"
  result_dir: "../../result/exp25_standalone_graphsage"
  runs_dir: "../../result/exp25_standalone_graphsage/runs"
  isolate_runs: true
  save_feature_matrices: false
