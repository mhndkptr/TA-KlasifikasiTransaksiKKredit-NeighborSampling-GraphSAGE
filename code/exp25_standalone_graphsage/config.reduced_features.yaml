experiment:
  id: "EXP25-StandaloneGraphSAGE-ReducedFeatures"
  run_id: null # Optional custom Run ID (null = auto: exp25_{sampling}_s{seed}_k{k1}x{k2}_{timestamp})
  version: "v1_reduced_features_gap45d"
  seed: 42
  evaluation_seed: 1042
  seeds: [42, 100, 2026, 3407, 8713]

data:
  transactions: "/kaggle/input/credit-card-transactions/credit_card_transactions-ibm_v2.csv"
  max_rows: null
  start_year: 2018 # Mempercepat loading

# Skenario Waktu: Train 180d, Val 30d, Gap 45d, Test 60d
# Test set tetap 100% identik dengan benchmark (283,529 tx, 421 fraud)
time_window:
  reference_date: "2018-03-25"
  train_days: 180
  val_days: 30
  gap_days: 45
  test_days: 60

# Pengurangan Fitur (Feature Ablation):
# - Merchant State DIHAPUS KEMBALI
# - Use Chip DITAMBAHKAN
# - MCC DITAMBAHKAN
# - amount_log TETAP DIAKTIFKAN (use_amount_log: true)
# Yang digunakan (9 fitur): Amount, amount_log, Use Chip, MCC, Errors?, dan 4 waktu siklik (hour_sin, hour_cos, dow_sin, dow_cos)
features:
  mode: "reduced"
  categorical_columns: ["Use Chip", "MCC", "Errors?"]
  use_amount_log: true
  use_cyclical_time: true
  exclude_high_cardinality: true

sampling:
  method: "uniform"
  undersampling_ratio: 1.0
  weight_attr: "sampling_weight"
  power_exponent: 1.0
  smoothing_alpha: 0.1
  topology_alpha: 0.5
  importance_gamma: 0.3
  ppr_teleport: 0.15
  ppr_steps: 3

model:
  hidden_channels: 128
  out_channels: 1
  num_layers: 2
  aggr: "mean"
  dropout: 0.2

training:
  batch_size: 1024
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  label_smoothing: 0.0
  grad_clip_norm: 5.0
  warmup_epochs: 0
  use_lr_scheduler: true
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 3
  early_stopping_patience: 7
  loss_weight_strategy: "sqrt"
  max_pos_weight: 50.0
  log_step_interval: 1
  num_neighbors: [5, 5]

threshold_calibration:
  selection_metric: "val_f1"
  min_precision_constraint: 0.15

operational:
  budgets: [100, 200, 300, 421, 500, 1000]

reproducibility:
  deterministic: true
  warn_only: true

execution:
  seeds_to_run: [42, 100, 2026, 3407, 8713]
  resume_completed: true

# Seluruh output disimpan langsung di dalam /kaggle/working/ agar otomatis ter-ekspor di UI Kaggle
logging:
  log_to_file: true
  log_dir: "result/exp25_standalone_graphsage/logs"
  log_level: "INFO"

output:
  model_dir: "model/exp25_standalone_graphsage"
  result_dir: "result/exp25_standalone_graphsage"
  runs_dir: "result/exp25_standalone_graphsage/runs"
  isolate_runs: true
  save_feature_matrices: false
