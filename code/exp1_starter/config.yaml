experiment:
  seeds: [42, 43, 44, 45, 46]
  strategies: [uniform, topology, importance]
  device: auto
  max_rows: 200000          # null untuk memakai seluruh 24.386.900 transaksi
  cache_graph: true

data:
  transactions: ../../dataset/credit_card_transactions-ibm_v2.csv
  split: [0.70, 0.15, 0.15]

model:
  hidden_channels: 256
  num_layers: 2
  dropout: 0.2

sampling:
  fanouts: [25, 10]
  topology_alpha: 0.5
  importance_gamma: 0.3
  ppr_beta: 0.15
  ppr_steps: 3

training:
  batch_size: 1024
  epochs: 100
  learning_rate: 0.001
  lr_patience: 5
  early_stopping_patience: 15
  num_workers: 0

evaluation:
  threshold: 0.5
  camouflage_normal_ratio: 0.70
  latency_nodes: 1000

paths:
  model_dir: ../../model
  result_dir: ../../result

