data:
  transactions: "../../dataset/credit_card_transactions-ibm_v2.csv"
  max_rows: null
  start_year: 2016

time_window:
  reference_date: "2018-01-01" # Tanggal T0 (era modern 2016-2020)
  train_days: 300
  val_days: 30
  gap_days: 8
  test_days: 60

features:
  # Opsi konfigurasi fitur untuk investigasi kebocoran:
  # - clean: Amount, Use Chip, MCC, Errors?, Merchant State, cyclical time (tanpa Zip & Merchant City)
  # - clean_basic: Amount, Use Chip, MCC, Errors?, Merchant State (tanpa cyclical time)
  # - legacy_leaky: Amount + 6 kategori lengkap termasuk Zip & City (untuk uji replikasi)
  mode: "clean"
  use_cyclical_time: true
  exclude_high_cardinality: true # Eksplisit memblokir Zip dan Merchant City

sampling:
  method: "uniform" # Pilihan: uniform, topology, importance
  undersampling_ratio: 1.0 # 1.0 = topologi asli dipertahankan

model:
  hidden_channels: 128 # 128-dimensi representasi struktural
  out_channels: 1
  num_layers: 2
  aggr: "mean"
  dropout: 0.2

training:
  batch_size: 1024
  epochs: 20 # Maksimal 20 epoch dengan early stopping
  learning_rate: 0.001
  weight_decay: 0.0001
  label_smoothing: 0.0 # Dinonaktifkan: Mencegah mode collapse
  grad_clip_norm: 5.0
  warmup_epochs: 0
  use_lr_scheduler: true
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 3
  early_stopping_patience: 7 # Early stopping berbasis Val AUPRC
  loss_weight_strategy: "sqrt" # Sqrt pos_weight teredam (~27x)
  max_pos_weight: 50.0
  log_step_interval: 1
  num_neighbors: [15, 10]

classifier:
  type: "xgboost"
  n_estimators: 100
  max_depth: 4 # Dibatasi ke 4 (mencegah pembentukan daun mikro yang menghafal ID)
  learning_rate: 0.05
  min_child_weight: 10 # Regularisasi: setiap daun minimal menampung bobot 10
  subsample: 0.8 # Mencegah overfitting pohon
  colsample_bytree: 0.8 # Memaksa pohon membagi split ke berbagai fitur (termasuk GNN)
  scale_pos_weight_strategy: "sqrt" # Pilihan: sqrt (~27x), moderate (10x), full (raw ratio), none (1.0)

output:
  model_dir: "../../model/exp21a"
  result_dir: "../../result/exp21a"
