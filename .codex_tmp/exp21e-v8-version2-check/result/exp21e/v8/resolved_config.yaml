  require_v6_runs: 18
  require_v7_runs: 5
  require_checkpoints: true
sampling:
  strategies:
  - uniform
  - topology
  - importance
  smoothing_alpha: 0.1
  fanout: 10
  destination_groups_per_relation: 24
  empirical_draws: 2000
  audit_seed: 4108
statistics:
  bootstrap_replicates: 2000
  confidence_level: 0.95
  bootstrap_seed: 3108
  alert_budgets:
  - 100
  - 200
  - 500
  - 1000
  super_hub_quantile: 0.99
embedding_audit:
  enabled: true
  batch_size: 1024
  num_neighbors:
  - 15
  - 10
  probability_tolerance: 1.0e-05
  device: auto
output:
  result_dir: /kaggle/working/result/exp21e/v8
  snapshot_source: true
