experiment:
  id: EXP21E
  version: v8
  stage: mechanism_audit_and_statistical_analysis
  seed: 2108
data:
  transactions: /kaggle/input/credit-card-transactions/credit_card_transactions-ibm_v2.csv
  start_year: 2016
time_window:
  reference_date: '2018-01-01'
  train_days: 300
  val_days: 30
  gap_days: 8
  test_days: 60
features:
  mode: clean
  use_cyclical_time: true
  use_amount_log: true
artifacts:
